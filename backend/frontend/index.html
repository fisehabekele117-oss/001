<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተሰራ ስራ መመዝገቢያ ስርዓት</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --primary: #229ED9;
            --secondary: #6C63FF;
            --card: rgba(255, 255, 255, .12);
            --border: rgba(255, 255, 255, .18);
            --text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #172554, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: #3b82f6;
            border-radius: 50%;
            filter: blur(120px);
            top: -120px;
            left: -120px;
            opacity: .45;
        }

        body::after {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: #7c3aed;
            border-radius: 50%;
            filter: blur(120px);
            bottom: -120px;
            right: -120px;
            opacity: .45;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            animation: fadeUp .8s ease;
            text-align: center;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(35px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 0 35px rgba(34, 158, 217, .45);
        }

        h1 {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            color: #d6d6d6;
            font-size: 14px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        a.menu-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 15px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--border);
            transition: .3s;
            text-align: left;
        }

        a.menu-btn:hover {
            background: rgba(255, 255, 255, .15);
            transform: translateY(-2px);
        }

        a.menu-btn .material-icons-round {
            font-size: 26px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            flex-shrink: 0;
        }

        a.menu-btn .label small {
            display: block;
            font-weight: 400;
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 2px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #d0d0d0;
            opacity: .8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <span class="material-icons-round">work</span>
        </div>

        <h1>የተሰራ ስራ መመዝገቢያ ስርዓት</h1>
        <p class="subtitle">የሚፈልጉትን ገጽ ይምረጡ</p>

        <div class="menu">
            <a class="menu-btn" href="register.html">
                <span class="material-icons-round">edit_note</span>
                <span class="label">
                    ስራ መዝግብ
                    <small>አዲስ የተሰራ ስራ ለመመዝገብ</small>
                </span>
            </a>

            <a class="menu-btn" href="admin.html">
                <span class="material-icons-round">dashboard</span>
                <span class="label">
                    መቆጣጠሪያ ፓናል
                    <small>የተመዘገቡ ስራዎችን ለመመልከት እና ለማስተዳደር</small>
                </span>
            </a>
        </div>

        <div class="footer">
            Made with ❤️ for Telegram Mini App
        </div>
    </div>

</body>
</html>
