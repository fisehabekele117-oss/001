<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተሰራ ስራ መመዝገቢያ</title>

    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --primary: #229ED9;
            --secondary: #6C63FF;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #0f172a;
            --card: rgba(255, 255, 255, .12);
            --border: rgba(255, 255, 255, .18);
            --text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #172554, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: #3b82f6;
            border-radius: 50%;
            filter: blur(120px);
            top: -120px;
            left: -120px;
            opacity: .45;
        }

        body::after {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: #7c3aed;
            border-radius: 50%;
            filter: blur(120px);
            bottom: -120px;
            right: -120px;
            opacity: .45;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            animation: fadeUp .8s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(35px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 0 35px rgba(34, 158, 217, .45);
        }

        h2 {
            margin-top: 20px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 25px;
            color: #d6d6d6;
            font-size: 14px;
        }

        .form-group { margin-bottom: 18px; }

        .date-row {
            display: flex;
            gap: 10px;
        }

        .date-row .form-group {
            flex: 1;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, .08);
            color: white;
            font-size: 15px;
            transition: .3s;
        }

        select option { background: #0f172a; color: white; }

        input[type="file"] { padding: 10px; cursor: pointer; }

        input::placeholder, textarea::placeholder { color: #bbb; }

        input:focus, select:focus, textarea:focus {
            background: rgba(255, 255, 255, .15);
            box-shadow: 0 0 0 2px var(--primary);
        }

        #customYearGroup {
            display: none;
            margin-top: -10px;
            margin-bottom: 18px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(34, 158, 217, .35); }
        button:active { transform: scale(.97); }
        button:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

        .success, .error {
            display: none;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            color: white;
        }

        .success { background: var(--success); }
        .error { background: var(--danger); }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #d0d0d0;
            opacity: .8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <span class="material-icons-round">work</span>
        </div>

        <h2>የተሰራ ስራ መመዝገቢያ</h2>
        <p class="subtitle">የተሰራ ስራን በፍጥነት እና በቀላሉ ይመዝግቡ</p>

        <form id="jobForm">
            <!-- ቀን / ወር / ዓመተ ምህረት መምረጫ -->
            <div class="date-row">
                <div class="form-group">
                    <label>📆 ቀን</label>
                    <select id="day" required>
                        <option value="" disabled selected>ቀን</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>🗓️ ወር</label>
                    <select id="month" required>
                        <option value="" disabled selected>ወር</option>
                        <option value="መስከረም">መስከረም</option>
                        <option value="ጥቅምት">ጥቅምት</option>
                        <option value="ኅዳር">ኅዳር</option>
                        <option value="ታኅሣሥ">ታኅሣሥ</option>
                        <option value="ጥር">ጥር</option>
                        <option value="የካቲት">የካቲት</option>
                        <option value="መጋቢት">መጋቢት</option>
                        <option value="ሚያዝያ">ሚያዝያ</option>
                        <option value="ግንቦት">ግንቦት</option>
                        <option value="ሰኔ">ሰኔ</option>
                        <option value="ሐምሌ">ሐምሌ</option>
                        <option value="ነሐሴ">ነሐሴ</option>
                        <option value="ጳጉሜ">ጳጉሜ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📅 ዓ.ም</label>
                    <select id="year" onchange="checkYearSelection()" required>
                        <option value="" disabled selected>ዓ.ም</option>
                        <option value="2018">2018</option>
                        <option value="2017">2017</option>
                        <option value="other">ሌላ</option>
                    </select>
                </div>
            </div>

            <!-- "ሌላ" ከተመረጠ የሚመጣ የጽሑፍ መፃፊያ ቦታ -->
            <div class="form-group" id="customYearGroup">
                <label>✏️ ሌላ ዓመተ ምህረት / ማብራሪያ ያስገቡ</label>
                <input type="text" id="customYear" placeholder="ለምሳሌ፦ 2016 ወይም ሌላ ማብራሪያ">
            </div>

            <div class="form-group">
                <label>🏢 ያሰራው ድርጅት / ጽ/ቤት</label>
                <input type="text" id="employerName" placeholder="ለምሳሌ፦ አዲስ አበባ ዩኒቨርሲቲ" required>
            </div>

            <div class="form-group">
                <label>🛠 የተሰራው ስራ</label>
                <input type="text" id="jobTitle" placeholder="ባነር፣ ፍሬም፣ ስቲከር..." required>
            </div>
<div class="form-group">
    <label>📏 ሳይዝ (Size)</label>
    <input type="text" id="size" placeholder="ለምሳሌ: M, L, XL ወይም 40, 42">
</div>
            <div class="form-group">
                <label>📦 ብዛት</label>
                <input type="number" id="quantity" placeholder="1" min="1" required>
            </div>

            <div class="form-group">
                <label>📍 ቦታ</label>
                <input type="text" id="location" placeholder="ቦሌ፣ አዲስ አበባ">
            </div>

            <div class="form-group">
                <label>👤 የኃላፊው ስም</label>
                <input type="text" id="contactPersonName" placeholder="ሙሉ ስም">
            </div>

            <div class="form-group">
                <label>📞 ስልክ ቁጥር</label>
                <input type="tel" id="contactPersonPhone" placeholder="0912345678">
            </div>

            <div class="form-group">
                <label>📝 ተጨማሪ ማብራሪያ</label>
                <textarea id="description" rows="3" placeholder="ከተፈለገ ተጨማሪ ማብራሪያ ያስገቡ"></textarea>
            </div>

            <div class="form-group">
                <label>📷 የስራ ፎቶ (Optional)</label>
                <input type="file" id="photo" accept="image/*">
            </div>

            <button type="submit" id="submitBtn">
                <span class="material-icons-round" style="vertical-align:middle;font-size:20px;">send</span>
                መረጃውን መዝግብ
            </button>
        </form>

        <div class="success" id="successMsg">✅ መረጃው በተሳካ ሁኔታ ተመዝግቧል!</div>
        <div class="error" id="errorMsg">⚠️ ስህተት ተፈጥሯል፣ እባክዎ እንደገና ይሞክሩ።</div>

        <div class="footer">
            Made with ❤️ for Telegram Mini App
        </div>
    </div>

    <script>
        // Telegram WebApp Initialization
        let tg = window.Telegram.WebApp;
        try { tg.expand(); tg.ready(); } catch (e) { /* running outside Telegram, ignore */ }

        const form = document.getElementById('jobForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const yearSelect = document.getElementById('year');
        const customYearGroup = document.getElementById('customYearGroup');
        const customYearInput = document.getElementById('customYear');
        const monthSelect = document.getElementById('month');
        const daySelect = document.getElementById('day');

        function populateDays(maxDays) {
            const previousValue = daySelect.value;
            daySelect.innerHTML = '<option value="" disabled selected>ቀን</option>';
            for (let d = 1; d <= maxDays; d++) {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                daySelect.appendChild(opt);
            }
            if (previousValue && Number(previousValue) <= maxDays) {
                daySelect.value = previousValue;
            }
        }

        // ጳጉሜ 6 ቀናት ብቻ አሉት (በአንዳንድ ዓመታት 5)፣ የተቀሩት ወራት 30 ቀናት አላቸው
        monthSelect.addEventListener('change', function () {
            populateDays(monthSelect.value === 'ጳጉሜ' ? 6 : 30);
        });

        populateDays(30);

        function checkYearSelection() {
            if (yearSelect.value === 'other') {
                customYearGroup.style.display = 'block';
                customYearInput.required = true;
            } else {
                customYearGroup.style.display = 'none';
                customYearInput.required = false;
                customYearInput.value = '';
            }
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // የዓመተ ምህረት ምርጫን ትክክለኛ ዋጋ መውሰድ ("ሌላ" ከሆነ የፃፈውን መውሰድ)
            let finalYear = yearSelect.value;
            if (finalYear === 'other') {
                finalYear = customYearInput.value;
            }

            const photoInput = document.getElementById('photo');
            const fd = new FormData();
            fd.append('year', finalYear);
            fd.append('month', monthSelect.value);
            fd.append('day', daySelect.value);
            fd.append('employerName', document.getElementById('employerName').value);
            fd.append('jobTitle', document.getElementById('jobTitle').value);
            fd.append('quantity', document.getElementById('quantity').value);
            fd.append('location', document.getElementById('location').value);
            fd.append('contactPersonName', document.getElementById('contactPersonName').value);
            fd.append('contactPersonPhone', document.getElementById('contactPersonPhone').value);
            fd.append('description', document.getElementById('description').value);
            if (photoInput.files[0]) {
                fd.append('photo', photoInput.files[0]);
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'በመላክ ላይ...';

            try {
                const res = await fetch('https://zero01-s6oc.onrender.com/api/workers', {
    method: 'POST',
    body: fd
});

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || 'Request failed');
                }

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                successMsg.style.display = 'block';
                form.reset();
                customYearGroup.style.display = 'none';
            } catch (err) {
                console.error('Submit error:', err);
                errorMsg.style.display = 'block';
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="material-icons-round" style="vertical-align:middle;font-size:20px;">send</span> መረጃውን መዝግብ';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
