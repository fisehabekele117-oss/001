<script>
        // Telegram WebApp Initialization
        let tg = window.Telegram.WebApp;
        try { tg.expand(); tg.ready(); } catch (e) { /* running outside Telegram, ignore */ }

        const API_BASE = 'https://zero01-s6oc.onrender.com';

        const form = document.getElementById('jobForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const yearSelect = document.getElementById('year');
        const customYearGroup = document.getElementById('customYearGroup');
        const customYearInput = document.getElementById('customYear');
        const monthSelect = document.getElementById('month');
        const daySelect = document.getElementById('day');

        function populateDays(maxDays) {
            const previousValue = daySelect.value;
            daySelect.innerHTML = '<option value="" disabled selected>ቀን</option>';
            for (let d = 1; d <= maxDays; d++) {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                daySelect.appendChild(opt);
            }
            if (previousValue && Number(previousValue) <= maxDays) {
                daySelect.value = previousValue;
            }
        }

        // ጳጉሜ 6 ቀናት ብቻ አሉት (በአንዳንድ ዓመታት 5)፣ የተቀሩት ወራት 30 ቀናት አላቸው
        monthSelect.addEventListener('change', function () {
            populateDays(monthSelect.value === 'ጳጉሜ' ? 6 : 30);
        });

        populateDays(30);

        function checkYearSelection() {
            if (yearSelect.value === 'other') {
                customYearGroup.style.display = 'block';
                customYearInput.required = true;
            } else {
                customYearGroup.style.display = 'none';
                customYearInput.required = false;
                customYearInput.value = '';
            }
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // የዓመተ ምህረት ምርጫን ትክክለኛ ዋጋ መውሰድ ("ሌላ" ከሆነ የፃፈውን መውሰድ)
            let finalYear = yearSelect.value;
            if (finalYear === 'other') {
                finalYear = customYearInput.value;
            }

            const photoInput = document.getElementById('photo');
            const fd = new FormData();
            fd.append('year', finalYear);
            fd.append('month', monthSelect.value);
            fd.append('day', daySelect.value);
            fd.append('employerName', document.getElementById('employerName').value);
            fd.append('jobTitle', document.getElementById('jobTitle').value);
            fd.append('quantity', document.getElementById('quantity').value);
            fd.append('location', document.getElementById('location').value);
            fd.append('contactPersonName', document.getElementById('contactPersonName').value);
            fd.append('contactPersonPhone', document.getElementById('contactPersonPhone').value);
            fd.append('description', document.getElementById('description').value);
            if (photoInput.files[0]) {
                fd.append('photo', photoInput.files[0]);
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'በመላክ ላይ...';

            try {
                const res = await fetch(`${API_BASE}/api/workers`, {
                    method: 'POST',
                    body: fd
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || 'Request failed');
                }

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                successMsg.style.display = 'block';
                form.reset();
                customYearGroup.style.display = 'none';
            } catch (err) {
                console.error('Submit error:', err);
                errorMsg.style.display = 'block';
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="material-icons-round" style="vertical-align:middle;font-size:20px;">send</span> መረጃውን መዝግብ';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        });
    </script>
