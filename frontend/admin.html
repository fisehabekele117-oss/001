<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተሰራ ስራ መቆጣጠሪያ ፓናል</title>

    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --primary: #229ED9;
            --secondary: #6C63FF;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #0f172a;
            --card: rgba(255, 255, 255, .12);
            --border: rgba(255, 255, 255, .18);
            --text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #172554, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: #3b82f6;
            border-radius: 50%;
            filter: blur(120px);
            top: -120px;
            left: -120px;
            opacity: .45;
        }

        body::after {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: #7c3aed;
            border-radius: 50%;
            filter: blur(120px);
            bottom: -120px;
            right: -120px;
            opacity: .45;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            animation: fadeUp .8s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(35px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background: rgba(255, 255, 255, .06);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .filter-group label { font-size: 14px; font-weight: 600; color: white; }

        select {
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: .3s;
        }

        select option { background: #0f172a; color: white; }
        select:focus { box-shadow: 0 0 0 2px var(--primary); }

        .refresh-btn {
            margin-left: auto;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .refresh-btn:hover { opacity: .9; }

        .table-responsive {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
            white-space: nowrap;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }

        th {
            background: rgba(34, 158, 217, 0.25);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
        tr:hover { background-color: rgba(255, 255, 255, 0.05); }

        .status-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: .3s;
        }
        .status-btn:disabled { opacity: .5; cursor: not-allowed; }

        .active-status {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }
        .active-status:hover { background-color: rgba(34, 197, 94, 0.3); }

        .finished-status {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .finished-status:hover { background-color: rgba(239, 68, 68, 0.3); }

        .photo-link { color: #38bdf8; text-decoration: none; font-size: 12px; }
        .photo-link:hover { text-decoration: underline; }

        td small { color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>የተሰራ ስራ መቆጣጠሪያ ፓናል</h2>

    <div class="filter-group">
        <label for="yearFilter"><strong>ዓመተ ምህረት ምረጥ:</strong></label>
        <select id="yearFilter" onchange="filterJobsByYear()">
            <option value="all">ሁሉም ዓመታት</option>
            <option value="2018">2018 ዓ.ም</option>
            <option value="2017">2017 ዓ.ም</option>
        </select>
        <button class="refresh-btn" onclick="fetchRegisteredJobs()">
            <span class="material-icons-round" style="font-size:16px;">refresh</span> አድስ
        </button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ቀን</th>
                    <th>ያሰራው አካል (ጽ/ቤት)</th>
                    <th>የስራ ዓይነት</th>
                    <th>ብዛት</th>
                    <th>ቦታ</th>
                    <th>ተወካይ ስም እና ስልክ</th>
                    <th>ፎቶ</th>
                    <th>ሁኔታ (Status)</th>
                </tr>
            </thead>
            <tbody id="jobTableBody">
                <tr>
                    <td colspan="8" style="text-align: center; padding: 20px;">መረጃዎችን በመጫን ላይ...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    try { tg.expand(); tg.ready(); } catch (e) { /* running outside Telegram, ignore */ }

    let allJobs = [];

    function fetchRegisteredJobs() {
        const tbody = document.getElementById('jobTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px;">መረጃዎችን በመጫን ላይ...</td></tr>';

        fetch('https://zero01-s6oc.onrender.com/api/workers')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                allJobs = data.map(job => ({
                    ...job,
                    status: job.status || 'active'
                }));
                filterJobsByYear();
            })
            .catch(error => {
                console.error('Error:', error);
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #f87171; padding: 20px;">መረጃዎችን ማምጣት አልተቻለም።</td></tr>';
            });
    }

    function displayJobs(jobs) {
        const tbody = document.getElementById('jobTableBody');
        tbody.innerHTML = '';

        if (jobs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px; color: #94a3b8;">ምንም የተመዘገበ ስራ የለም</td></tr>';
            return;
        }

        jobs.forEach(job => {
            const tr = document.createElement('tr');
            const isFinished = job.status === 'finished';

            const photoCell = job.photo
                ? `<a class="photo-link" href="${job.photo}" target="_blank" rel="noopener">ፎቶ ይመልከቱ</a>`
                : '<small>የለም</small>';

            const dateLabel = [job.day, job.month, job.year].filter(Boolean).join(' ') || (job.year || '2018');

            tr.innerHTML = `
                <td><strong>${escapeHtml(dateLabel)}</strong></td>
                <td>${escapeHtml(job.employerName || '-')}</td>
                <td>${escapeHtml(job.jobTitle || '-')}</td>
                <td>${escapeHtml(String(job.quantity || '-'))}</td>
                <td>${escapeHtml(job.location || '-')}</td>
                <td>${escapeHtml(job.contactPersonName || '-')}<br><small>${escapeHtml(job.contactPersonPhone || '')}</small></td>
                <td>${photoCell}</td>
                <td>
                    <button class="status-btn ${isFinished ? 'finished-status' : 'active-status'}" data-id="${job.id}" onclick="toggleJobStatus('${job.id}', this)">
                        ${isFinished ? 'አልቆዋል (Finished)' : 'እየሰራ ነው (Active)'}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    async function toggleJobStatus(jobId, btn) {
        btn.disabled = true;
        try {
            const res = await fetch(`/api/workers/${jobId}`, { method: 'PATCH' });
            if (!res.ok) throw new Error('Update failed');
            const updatedJob = await res.json();

            allJobs = allJobs.map(job => (job.id === jobId ? updatedJob : job));
            filterJobsByYear();

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        } catch (err) {
            console.error('Toggle status error:', err);
            btn.disabled = false;
            alert('ሁኔታውን መቀየር አልተቻለም፣ እባክዎ እንደገና ይሞክሩ።');
        }
    }

    function filterJobsByYear() {
        const selectedYear = document.getElementById('yearFilter').value;
        if (selectedYear === 'all') {
            displayJobs(allJobs);
        } else {
            const filtered = allJobs.filter(job => (job.year || '2018') === selectedYear);
            displayJobs(filtered);
        }
    }

    fetchRegisteredJobs();
</script>

</body>
</html>
