<script>
    document.addEventListener('DOMContentLoaded', async function () {
        // Telegram WebApp Initialization
        let tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        try { if (tg) { tg.expand(); tg.ready(); } } catch (e) { /* running outside Telegram, ignore */ }

        const API_BASE = 'https://zero01-s6oc.onrender.com';
        
        const tableBody = document.querySelector('tbody') || document.getElementById('tableBody');
        const errorMsg = document.getElementById('errorMsg');
        const yearFilter = document.getElementById('yearFilter'); // የዓመት ማጣሪያ ካለ

        async function fetchWorkers() {
            try {
                const res = await fetch(`${API_BASE}/api/workers`);
                if (!res.ok) {
                    throw new Error('Network response was not ok');
                }
                const workers = await res.json();
                renderTable(workers);
            } catch (err) {
                console.error('Fetch error:', err);
                if (errorMsg) errorMsg.style.display = 'block';
                // ሰንጠረዡ ባዶ ከሆነ የስህተት መልእክት ለማሳየት
                if (tableBody) {
                    tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:red;">መረጃዎችን ማምጣት አልተቻለም።</td></tr>`;
                }
            }
        }

        function renderTable(workers) {
            if (!tableBody) return;
            tableBody.innerHTML = '';

            if (!workers || workers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center;">ምንም የተመዘገበ መረጃ የለም።</td></tr>`;
                return;
            }

            workers.forEach((worker, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${worker.employerName || ''}</td>
                    <td>${worker.jobTitle || ''}</td>
                    <td>${worker.quantity || ''}</td>
                    <td>${worker.day || ''} ${worker.month || ''} ${worker.year || ''}</td>
                    <td>${worker.location || ''}</td>
                    <td>${worker.contactPersonName || ''} (${worker.contactPersonPhone || ''})</td>
                    <td>${worker.description || ''}</td>
                    <td><span class="badge ${worker.status === 'Active' ? 'success' : 'pending'}">${worker.status || 'Active'}</span></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // ገጹ ሲከፈት መረጃዎችን ከባክኤንድ ማምጣት
        fetchWorkers();
    });
</script>
